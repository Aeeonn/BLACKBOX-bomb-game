<!doctype html>
<meta charset="utf-8"><title>SCOPE</title>
<link rel="stylesheet" href="/common/ui.css">
<h1>S C O P E</h1><p id="status"></p>
<div class="stagewrap"><canvas id="stage" width="900" height="320"></canvas></div>
<div class="flags" id="flags"></div>
<div class="hud"><div id="time">--:--</div><div class="strikes" id="strikes"></div></div>
<p style="color:#6b6b6b;font-size:13px">Internal topology only. No colours, no textures. You are MUTED - draw for BOOK. (Phase 5 replaces this readout with the shared canvas.)</p>
<div id="bombfaces"></div>
<pre id="nets" style="font-size:15px"></pre>
<div id="log"></div>
<script type="module">
import { connect, on, send, logLine, fmtTime, ROLE } from "/common/net.js";
import { updateOverlay } from "/common/overlay.js";
import { init as initStage, setPresence, setBomb, findPlayer } from "/common/stage.js";
import { renderBombFace, paintCharge } from "/common/bombface.js";
let lastPayload = null, presence = null;
initStage(document.getElementById("stage"), ROLE, send);
on("presence", m => { presence = m.payload; setPresence(m.payload); if (lastPayload) drawScopeShells(lastPayload); });
on("log", m => logLine(m.text));

// SCOPE's shell: slot indices only, same as BOOK - SCOPE's own views() has no
// per-slot colour or texture either, only the netlist already shown below.
function drawScopeShells(payload) {
  const layouts = payload.layouts || [];
  const container = document.getElementById("bombfaces");
  while (container.children.length > layouts.length) {
    container.removeChild(container.lastChild);
  }
  const hp = findPlayer(presence, "hands");
  const probe = hp && hp.probe;
  const charge = hp && hp.charge;
  layouts.forEach((layout, i) => {
    let box = container.children[i];
    if (!box) {
      box = document.createElement("div");
      box.className = "bombface-wrap";
      box.innerHTML = '<div class="bombface-label"></div><div class="bombface"></div>';
      container.appendChild(box);
    }
    box.querySelector(".bombface-label").textContent = "Module " + (i + 1);
    renderBombFace(box.querySelector(".bombface"), layout, (el, slot, idx) => {
      const isProbed = probe && probe.module === i && probe.cell === idx;
      const isCharging = charge && charge.module === i && charge.cell === idx;
      el.className = "slot" + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.textContent = String(idx + 1);
      paintCharge(el, isCharging ? charge.progress : null);
    });
  });
}

on("state", s => {
  const p = s.payload;
  document.getElementById("time").textContent = fmtTime(p.time_left);
  document.getElementById("strikes").textContent = "X".repeat(p.strikes);
  document.getElementById("flags").textContent =
    "board rev " + p.flags.board_rev + " / " + p.flags.jumpers + " jumpers / capacitor " + p.flags.capacitor;
  document.getElementById("nets").textContent = p.modules.map((m, i) =>
    "module " + (i + 1) + ": " + m.count + " pads, nets " +
    (m.nets && m.nets.length ? m.nets.map(n => "(" + (n[0]+1) + "-" + (n[1]+1) + ")").join(" ") : "none")
  ).join("\n");
  updateOverlay(p.phase);
  setBomb(p);
  lastPayload = p;
  drawScopeShells(p);
});
connect();
</script>
