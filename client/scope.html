<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCOPE &middot; BLACKBOX</title>
<link rel="icon" href="/common/icon.svg">
<link rel="stylesheet" href="/common/ui.css">
<body data-role="scope">
<header class="topbar" id="topbar"></header>
<main class="game">
  <section class="room-col">
    <div class="hud" id="hud"></div>
    <div class="stage-frame"><canvas id="stage"></canvas></div>
    <div class="brief" id="brief"></div>
    <div class="log" id="log"></div>
  </section>
  <section class="console">
    <div class="panel">
      <div class="panel-title">THE BOARD <small>internal topology only &middot; no colours, no textures</small></div>
      <div class="chips" id="flags"><span class="chip muted">No board to read until the bomb is armed.</span></div>
    </div>
    <div class="panel">
      <div class="panel-title">NETLIST <small>a drawing canvas to MUTE is planned</small></div>
      <pre class="netlist" id="nets">&mdash;</pre>
    </div>
    <div class="panel">
      <div class="panel-title">PADS</div>
      <div class="shells" id="bombfaces"></div>
    </div>
  </section>
</main>
<script type="module">
import { connect, on } from "/common/net.js";
import { initChrome, getPresence } from "/common/chrome.js";
import { renderShells, esc } from "/common/skins.js";

initChrome();
const $ = id => document.getElementById(id);
let state = null;
on("state", m => { state = m.payload; draw(); });
on("presence", () => draw());

// SCOPE's own views() carry the netlist and pad counts only - no per-slot
// colour or texture - so the pads below are index-only shells, like MUTE's.
// MUTE's pointer shows read-only here; SCOPE never points.
function draw() {
  const s = state; if (!s) return;
  const f = s.flags || {};
  $("flags").innerHTML = '<span class="chip">board rev <b>' + esc(f.board_rev) + '</b></span>' +
    '<span class="chip"><b>' + esc(f.jumpers) + '</b> jumpers</span>' +
    '<span class="chip">capacitor <b>' + esc(f.capacitor) + '</b></span>';
  $("nets").textContent = s.modules.map((m, i) => "module " + (i + 1) + ": " + m.count + " pads, nets " +
    (m.nets && m.nets.length ? m.nets.map(n => "(" + (n[0] + 1) + "-" + (n[1] + 1) + ")").join(" ") : "none")).join("\n");
  renderShells($("bombfaces"), s, getPresence(), { pointLabel: "\u25C9 MUTE POINTING" });
}

connect();
</script>
