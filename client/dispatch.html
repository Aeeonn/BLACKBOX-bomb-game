<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISPATCH &middot; BLACKBOX</title>
<link rel="icon" href="/common/icon.svg">
<link rel="stylesheet" href="/common/ui.css">
<body data-role="dispatch">
<header class="topbar" id="topbar"></header>
<main class="game">
  <section class="room-col">
    <div class="hud" id="hud"></div>
    <div class="stage-frame"><canvas id="stage"></canvas></div>
    <div class="brief" id="brief"></div>
    <div class="log" id="log"></div>
  </section>
  <section class="console">
    <div class="panel big-readout">
      <div class="panel-title">THE GLOBAL LAYER <small>no module contents &middot; talk to BLIND</small></div>
      <div class="timer idle" id="bigtimer"><span class="ghost">88:88</span><span id="bigtime">--:--</span></div>
      <div class="chips" id="summary"><span class="chip muted">Waiting for the bomb to be armed.</span></div>
    </div>
  </section>
</main>
<script type="module">
import { connect, on } from "/common/net.js";
import { initChrome, mmss } from "/common/chrome.js";

initChrome();
const $ = id => document.getElementById(id);

// DISPATCH's snapshot carries no module contents at all - only the round's
// global fields, which every role receives identically.
on("state", m => {
  const s = m.payload;
  $("bigtime").textContent = mmss(s.time_left);
  $("bigtimer").className = $("timer").className;
  $("summary").innerHTML = '<span class="chip"><b>' + s.modules.length + "</b> modules armed</span>" +
    '<span class="chip">strikes <b>' + s.strikes + " / " + s.max_strikes + "</b></span>" +
    (s.paused ? '<span class="chip"><b>PAUSED</b></span>' : "");
});

connect();
</script>
