<!doctype html>
<meta charset="utf-8"><title>DEAF</title>
<link rel="stylesheet" href="/common/ui.css">
<div id="flash"></div>
<h1>D E A F</h1><p id="status"></p>
<p class="comms-card" id="comms"></p>
<div class="roster" id="roster"></div>
<button class="readybtn" id="ready">I'M READY</button>
<div class="stagewrap"><canvas id="stage" width="900" height="320"></canvas></div>
<div class="flags" id="flags"></div>
<div class="hud"><div id="time">--:--</div><div class="strikes" id="strikes"></div><div id="phase"></div></div>
<p style="color:#6b6b6b;font-size:13px">TAB switches module. You are DEAFENED in Discord.</p>
<p class="pointer-hint" id="pointerhint"></p>
<div class="bombface" id="grid"></div>
<div id="log"></div>
<script type="module">
import { connect, on, send, logLine, fmtTime, ROLE } from "/common/net.js";
import { updateOverlay } from "/common/overlay.js";
import { init as initStage, setPresence, setBomb, findPlayer } from "/common/stage.js";
import { renderBombFace, paintCharge } from "/common/bombface.js";
import { COMMS, renderRoster, pauseText, DISPLAY_NAME } from "/common/roster.js";
document.getElementById("comms").textContent = COMMS[ROLE];
let mod = 0, state = null, presence = null;
const SWATCH = { red:"#b33", blue:"#36c", yellow:"#dc3", white:"#eee", black:"#000", green:"#3a3" };

on("lobby", m => renderRoster(document.getElementById("roster"), m.roster));
let isReady = false;
const readyBtn = document.getElementById("ready");
readyBtn.onclick = () => {
  isReady = !isReady;
  send({ type: "ready", value: isReady });
  readyBtn.classList.toggle("is-ready", isReady);
  readyBtn.textContent = isReady ? "\u2713 READY" : "I'M READY";
};

initStage(document.getElementById("stage"), ROLE, send);
on("presence", m => { presence = m.payload; setPresence(m.payload); draw(); });
on("state", m => { state = m.payload; draw(); updateOverlay(state.phase); setBomb(state); });
on("log", m => logLine(m.text));
on("flash", m => {
  const f = document.getElementById("flash");
  f.textContent = m.card; f.style.display = "flex";
  setTimeout(() => { f.style.display = "none"; }, 1200);
});

function draw() {
  const s = state; if (!s) return;
  document.getElementById("time").textContent = fmtTime(s.time_left);
  document.getElementById("strikes").textContent = "X".repeat(s.strikes);
  const ph = document.getElementById("phase");
  if (s.paused) { ph.textContent = pauseText(presence); ph.className = "paused"; }
  else { ph.textContent = s.phase === "running" ? "" : s.phase.toUpperCase(); ph.className = s.phase; }
  document.getElementById("flags").textContent =
    "serial " + s.flags.serial + " / badge " + s.flags.badge + " / " + s.flags.leds + " LEDs lit / sticker " + s.flags.sticker;
  const v = s.modules[mod] || { wires: [] };
  const layout = (s.layouts && s.layouts[mod]) || { slots: [] };
  const hp = findPlayer(presence, "hands");
  const probe = hp && hp.probe;
  const charge = hp && hp.charge;
  // T12: BOOK's pointer is module-level only. EYES only shows one module at
  // a time (TAB to switch), so a per-slot highlight doesn't apply here the
  // way it does on BOOK/SCOPE's all-modules-at-once shells - a text hint
  // plus a border on the grid once you've tabbed to the right module does
  // the same job.
  const bp = findPlayer(presence, "book");
  const pointedModule = bp && bp.pointer ? bp.pointer.module : null;
  const hint = document.getElementById("pointerhint");
  hint.textContent = pointedModule == null ? "" : DISPLAY_NAME.book + " is pointing at module " + (pointedModule + 1);
  hint.className = "pointer-hint" + (pointedModule != null ? " active" : "");
  const grid = document.getElementById("grid");
  grid.classList.toggle("pointed", pointedModule === mod);
  renderBombFace(grid, layout, (el, slot, i) => {
    const w = v.wires[i] || {};
    const isProbed = probe && probe.module === mod && probe.cell === i;
    const isCharging = charge && charge.module === mod && charge.cell === i;
    el.className = "slot" + (w.cut ? " cut" : "") + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
    el.style.borderColor = SWATCH[w.colour] || "#333";
    el.innerHTML = "<div>[" + (i + 1) + "]<br>" + (w.colour || "") + (i === v.led_wire ? "<br><small>LED</small>" : "") + "</div>";
    paintCharge(el, isCharging ? charge.progress : null);
  });
}
addEventListener("keydown", e => {
  if (e.key === "Tab" && state) { e.preventDefault(); mod = (mod + 1) % state.modules.length; draw(); }
});
connect();
</script>
