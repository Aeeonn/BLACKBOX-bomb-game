<!doctype html>
<meta charset="utf-8"><title>EYES</title>
<link rel="stylesheet" href="/common/ui.css">
<div id="flash"></div>
<h1>E Y E S</h1><p id="status"></p>
<div class="stagewrap"><canvas id="stage" width="900" height="320"></canvas></div>
<div class="flags" id="flags"></div>
<div class="hud"><div id="time">--:--</div><div class="strikes" id="strikes"></div><div id="phase"></div></div>
<p style="color:#6b6b6b;font-size:13px">TAB switches module. You are DEAFENED in Discord.</p>
<div class="grid" id="grid"></div>
<div id="log"></div>
<script type="module">
import { connect, on, logLine, fmtTime, ROLE } from "/common/net.js";
import { updateOverlay } from "/common/overlay.js";
import { init as initStage, setPresence, setBomb } from "/common/stage.js";
let mod = 0, state = null;
const SWATCH = { red:"#b33", blue:"#36c", yellow:"#dc3", white:"#eee", black:"#000", green:"#3a3" };

initStage(document.getElementById("stage"), ROLE);
on("presence", m => setPresence(m.payload));
on("state", m => { state = m.payload; draw(); updateOverlay(state.phase); setBomb(state); });
on("log", m => logLine(m.text));
on("flash", m => {
  const f = document.getElementById("flash");
  f.textContent = m.card; f.style.display = "flex";
  setTimeout(() => { f.style.display = "none"; }, 1200);
});

function draw() {
  const s = state; if (!s) return;
  document.getElementById("time").textContent = fmtTime(s.time_left);
  document.getElementById("strikes").textContent = "X".repeat(s.strikes);
  const ph = document.getElementById("phase");
  ph.textContent = s.phase === "running" ? "" : s.phase.toUpperCase();
  ph.className = s.phase;
  document.getElementById("flags").textContent =
    "serial " + s.flags.serial + " / badge " + s.flags.badge + " / " + s.flags.leds + " LEDs lit / sticker " + s.flags.sticker;
  const v = s.modules[mod] || { wires: [] };
  const g = document.getElementById("grid"); g.innerHTML = "";
  v.wires.forEach((w, i) => {
    const d = document.createElement("div");
    d.className = "cell" + (w.cut ? " cut" : "");
    d.style.borderColor = SWATCH[w.colour] || "#333";
    d.innerHTML = "<div>[" + (i + 1) + "]<br>" + w.colour + (i === v.led_wire ? "<br><small>LED</small>" : "") + "</div>";
    g.appendChild(d);
  });
}
addEventListener("keydown", e => {
  if (e.key === "Tab" && state) { e.preventDefault(); mod = (mod + 1) % state.modules.length; draw(); }
});
connect();
</script>
