<!doctype html>
<meta charset="utf-8"><title>DEAF</title>
<link rel="stylesheet" href="/common/ui.css">
<div id="flash"></div>
<h1>D E A F</h1><p id="status"></p>
<p class="comms-card" id="comms"></p>
<button class="help-toggle" id="helpToggle">? How do I play this role</button>
<div class="help-panel" id="helpPanel" hidden></div>
<div class="roster" id="roster"></div>
<button class="readybtn" id="ready">I'M READY</button>
<div class="stagewrap"><canvas id="stage" width="900" height="320"></canvas></div>
<div class="flags" id="flags"></div>
<div class="hud"><div id="time">--:--</div><div class="strikes" id="strikes"></div><div id="phase"></div></div>
<p style="color:#6b6b6b;font-size:13px">TAB switches module. You are DEAFENED in Discord.</p>
<p class="pointer-hint" id="pointerhint"></p>
<div class="bombface" id="grid"></div>
<div id="log"></div>
<script type="module">
import { connect, on, send, logLine, fmtTime, ROLE } from "/common/net.js";
import { updateOverlay } from "/common/overlay.js";
import { updateFeedback } from "/common/feedback.js";
import { init as initStage, setPresence, setBomb, findPlayer } from "/common/stage.js";
import { renderBombFace, paintCharge } from "/common/bombface.js";
import { COMMS, HELP, renderRoster, pauseText, DISPLAY_NAME } from "/common/roster.js";
document.getElementById("comms").textContent = COMMS[ROLE];
document.getElementById("helpPanel").textContent = HELP[ROLE];
document.getElementById("helpToggle").onclick = () => {
  const panel = document.getElementById("helpPanel");
  panel.hidden = !panel.hidden;
};
let mod = 0, state = null, presence = null;
const SWATCH = { red:"#b33", blue:"#36c", yellow:"#dc3", white:"#eee", black:"#000", green:"#3a3",
                 amber:"#c80", teal:"#288" };

on("lobby", m => renderRoster(document.getElementById("roster"), m.roster));
let isReady = false;
const readyBtn = document.getElementById("ready");
readyBtn.onclick = () => {
  isReady = !isReady;
  send({ type: "ready", value: isReady });
  readyBtn.classList.toggle("is-ready", isReady);
  readyBtn.textContent = isReady ? "\u2713 READY" : "I'M READY";
};

initStage(document.getElementById("stage"), ROLE, send);
on("presence", m => { presence = m.payload; setPresence(m.payload); draw(); });
on("state", m => {
  state = m.payload;
  draw();
  updateOverlay(state.phase, undefined, state.paused, pauseText(presence));
  // updateFeedback's audio half is a no-op for DEAF (see feedback.js's own
  // ALLOWED gate, same hands/book-only rule as the timer tick) - the flash
  // half is NOT gated, since strikes/solved-count are already broadcast to
  // every role and a visual cue reacting to them leaks nothing new.
  updateFeedback(state.strikes, state.modules.filter(mv => mv.solved).length, state.phase);
  setBomb(state);
});
on("log", m => logLine(m.text));
on("flash", m => {
  const f = document.getElementById("flash");
  f.textContent = m.card; f.style.display = "flex";
  setTimeout(() => { f.style.display = "none"; }, 1200);
});

function draw() {
  const s = state; if (!s) return;
  document.getElementById("time").textContent = fmtTime(s.time_left);
  document.getElementById("strikes").textContent = "X".repeat(s.strikes);
  const ph = document.getElementById("phase");
  if (s.paused) { ph.textContent = pauseText(presence); ph.className = "paused"; }
  else { ph.textContent = s.phase === "running" ? "" : s.phase.toUpperCase(); ph.className = s.phase; }
  document.getElementById("flags").textContent =
    "serial " + s.flags.serial + " / badge " + s.flags.badge + " / " + s.flags.leds + " LEDs lit / sticker " + s.flags.sticker;
  const v = s.modules[mod] || { kind: "wires", wires: [] };
  const layout = (s.layouts && s.layouts[mod]) || { slots: [] };
  const hp = findPlayer(presence, "hands");
  const probe = hp && hp.probe;
  const charge = hp && hp.charge;
  // T12: BOOK's pointer is module-level only. EYES only shows one module at
  // a time (TAB to switch), so a per-slot highlight doesn't apply here the
  // way it does on BOOK/SCOPE's all-modules-at-once shells - a text hint
  // plus a border on the grid once you've tabbed to the right module does
  // the same job.
  const bp = findPlayer(presence, "book");
  const pointedModule = bp && bp.pointer ? bp.pointer.module : null;
  const hint = document.getElementById("pointerhint");
  hint.textContent = pointedModule == null ? "" : DISPLAY_NAME.book + " is pointing at module " + (pointedModule + 1);
  hint.className = "pointer-hint" + (pointedModule != null ? " active" : "");
  const grid = document.getElementById("grid");
  grid.classList.toggle("pointed", pointedModule === mod);
  // T14/T15: EYES' own look now depends on which module this is - M1's wires
  // show a colour + LED marker; M2's Ledger tiles show a plain printed
  // number; N1's Vent shows which of the three vents is currently glowing
  // (a live signal, not a per-slot "resolved" state - a needy module's vent
  // un-glows and can re-glow again later, so there's no "cut" look for it).
  // All three still get the same probed/charging highlight, since those
  // come from HANDS' presence data, not from the module itself.
  renderBombFace(grid, layout, (el, slot, i) => {
    const isProbed = probe && probe.module === mod && probe.cell === i;
    const isCharging = charge && charge.module === mod && charge.cell === i;
    if (v.kind === "ledger") {
      const t = (v.tiles && v.tiles[i]) || {};
      el.className = "slot" + (t.resolved ? " cut" : "") + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.style.borderColor = "#333";
      el.innerHTML = "<div>[" + (i + 1) + "]<br><b style=\"font-size:20px\">" + (t.value != null ? t.value : "") + "</b></div>";
    } else if (v.kind === "vent") {
      const glowing = v.glowing === i;
      el.className = "slot" + (glowing ? " glowing" : "") + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.style.borderColor = glowing ? "#c8402f" : "#333";
      el.innerHTML = "<div>[" + (i + 1) + "]" + (glowing ? "<br><small>GLOWING</small>" : "") + "</div>";
    } else if (v.kind === "gauge") {
      // T16: one slot only (the dial itself) - shows the needle's current
      // 1-12 number. EYES never sees the target zone, only where the
      // needle currently sits; the zone lives solely in MUTE's manual.
      el.className = "slot" + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.style.borderColor = "#333";
      el.innerHTML = "<div>Needle at<br><b style=\"font-size:28px\">" + (v.position + 1) +
        "</b><br><small>of " + v.count + "</small></div>";
    } else if (v.kind === "manifest") {
      // M4: EYES only ever sees the printed letter, never HANDS' felt
      // symbol or the step it maps to - same "one axis each" split as
      // ledger's number, just a letter instead.
      const t = (v.stamps && v.stamps[i]) || {};
      el.className = "slot" + (t.pressed ? " cut" : "") + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.style.borderColor = "#333";
      el.innerHTML = "<div>[" + (i + 1) + "]<br><b style=\"font-size:22px\">" + (t.letter || "") + "</b></div>";
    } else if (v.kind === "static") {
      // M5: EYES only ever sees the tile's colour, never HANDS' felt
      // buzz/quiet state or the buzzing tally it adds up to - EYES has no
      // way to know which colour is currently correct without hearing that
      // tally from HANDS and the rule from BOOK.
      const t = (v.tiles && v.tiles[i]) || {};
      el.className = "slot" + (t.pressed ? " cut" : "") + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.style.borderColor = SWATCH[t.colour] || "#333";
      el.innerHTML = "<div>[" + (i + 1) + "]<br>" + (t.colour || "") + "</div>";
    } else {
      const w = v.wires[i] || {};
      el.className = "slot" + (w.cut ? " cut" : "") + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.style.borderColor = SWATCH[w.colour] || "#333";
      el.innerHTML = "<div>[" + (i + 1) + "]<br>" + (w.colour || "") + (i === v.led_wire ? "<br><small>LED</small>" : "") + "</div>";
    }
    paintCharge(el, isCharging ? charge.progress : null);
  });
}
addEventListener("keydown", e => {
  if (e.key === "Tab" && state) { e.preventDefault(); mod = (mod + 1) % state.modules.length; draw(); }
});
connect();
</script>
