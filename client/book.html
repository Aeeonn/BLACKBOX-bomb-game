<!doctype html>
<meta charset="utf-8"><title>BOOK</title>
<link rel="stylesheet" href="/common/ui.css">
<h1>B O O K</h1><p id="status"></p>
<div class="stagewrap"><canvas id="stage" width="900" height="320"></canvas></div>
<div class="hud"><div id="time">--:--</div><div class="strikes" id="strikes"></div><div id="phase"></div></div>
<p style="color:#6b6b6b;font-size:13px">You are MUTED in Discord. Nod, wave, and use the cards. 2s cooldown.</p>
<div class="cards" id="cards"></div>
<div id="bombfaces"></div>
<p style="margin-top:14px"><button id="start">ARM THE BOMB</button>
  <a id="manual" style="color:#e8e4d8;margin-left:14px" target="_blank">OPEN MANUAL</a></p>
<iframe id="frame" style="width:100%;height:60vh;margin-top:12px;background:#fdfaf2;border:1px solid #444"></iframe>
<div id="log"></div>
<script type="module">
import { connect, on, send, logLine, fmtTime, ROOM, ROLE } from "/common/net.js";
import { updateOverlay } from "/common/overlay.js";
import { updateTimerAudio } from "/common/timer-audio.js";
import { init as initStage, setPresence, setBomb, findPlayer } from "/common/stage.js";
import { renderBombFace, paintCharge } from "/common/bombface.js";
const CARDS = ["STOP","GO","YES","NO","WAIT","AGAIN","1","2","3","4","LEFT","RIGHT"];
let cooling = false;
const wrap = document.getElementById("cards");
CARDS.forEach(c => {
  const b = document.createElement("button");
  b.textContent = c;
  b.onclick = () => {
    if (cooling) return;
    send({ type: "flash", card: c });
    cooling = true; wrap.style.opacity = .35;
    setTimeout(() => { cooling = false; wrap.style.opacity = 1; }, 2000);
  };
  wrap.appendChild(b);
});
document.getElementById("manual").href = "/manual/" + ROOM;
// Shared by the initial ARM button and the overlay's REARM button - the
// server always builds a fresh Bomb here, and ignores this while a round
// is still running, so it's safe to wire to both.
function arm() {
  send({ type: "start", modules: 2, seconds: 300 });
  setTimeout(() => { document.getElementById("frame").src = "/manual/" + ROOM; }, 400);
}
document.getElementById("start").onclick = arm;
let lastPayload = null, presence = null;
initStage(document.getElementById("stage"), ROLE);
on("presence", m => { presence = m.payload; setPresence(m.payload); if (lastPayload) drawBookShells(lastPayload); });

// BOOK's shell: slot indices only, no colour or texture - BOOK's own views()
// never carries per-slot data in the first place, so there is nothing here
// that could leak. Reuses one .bombface-wrap per module across updates
// rather than rebuilding the DOM every state tick.
function drawBookShells(payload) {
  const layouts = payload.layouts || [];
  const container = document.getElementById("bombfaces");
  while (container.children.length > layouts.length) {
    container.removeChild(container.lastChild);
  }
  const hp = findPlayer(presence, "hands");
  const probe = hp && hp.probe;
  const charge = hp && hp.charge;
  layouts.forEach((layout, i) => {
    let box = container.children[i];
    if (!box) {
      box = document.createElement("div");
      box.className = "bombface-wrap";
      box.innerHTML = '<div class="bombface-label"></div><div class="bombface"></div>';
      container.appendChild(box);
    }
    const mv = payload.modules[i] || {};
    box.querySelector(".bombface-label").textContent =
      "Module " + (i + 1) + (mv.module ? " - " + mv.module : "") + (mv.solved ? " (solved)" : "");
    renderBombFace(box.querySelector(".bombface"), layout, (el, slot, idx) => {
      const isProbed = probe && probe.module === i && probe.cell === idx;
      const isCharging = charge && charge.module === i && charge.cell === idx;
      el.className = "slot" + (isProbed ? " probed" : "") + (isCharging ? " charging" : "");
      el.textContent = String(idx + 1);
      paintCharge(el, isCharging ? charge.progress : null);
    });
  });
}

on("state", s => {
  document.getElementById("time").textContent = fmtTime(s.payload.time_left);
  document.getElementById("strikes").textContent = "X".repeat(s.payload.strikes);
  const p = document.getElementById("phase");
  p.textContent = s.payload.phase === "running" ? "" : s.payload.phase.toUpperCase();
  p.className = s.payload.phase;
  updateOverlay(s.payload.phase, arm);
  updateTimerAudio(s.payload.time_left, s.payload.phase);
  setBomb(s.payload);
  lastPayload = s.payload;
  drawBookShells(s.payload);
});
on("log", m => logLine(m.text));
connect();
</script>
