<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLIND &middot; BLACKBOX</title>
<link rel="icon" href="/common/icon.svg">
<link rel="stylesheet" href="/common/ui.css">
<body data-role="blind">
<header class="topbar" id="topbar"></header>
<main class="game">
  <section class="room-col">
    <div class="hud" id="hud"></div>
    <div class="stage-frame"><canvas id="stage"></canvas></div>
    <div class="brief" id="brief"></div>
    <div class="log" id="log"></div>
  </section>
  <section class="console">
    <div class="panel">
      <div class="panel-title">THE CASING <small>what your hands tell you about the whole bomb</small></div>
      <div class="chips" id="flags"><span class="chip muted">Nothing to feel until the bomb is armed.</span></div>
    </div>
    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="bombface tactile" id="grid"></div>
      <div class="readout"><span class="readout-label">FINGERTIP</span><span class="readout-text idle" id="readout">Touch a cell to feel it.</span></div>
      <div class="actions" id="actionbtns"></div>
      <div class="keys"><span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move</span><span><kbd>TAB</kbd> next module</span><span>hold a key until the bar fills to act</span></div>
    </div>
  </section>
</main>
<script type="module">
import { connect, on, send } from "/common/net.js";
import { initChrome } from "/common/chrome.js";
import { makeHold, holdButtons } from "/common/hold.js";
import { renderBombFace, paintCharge } from "/common/bombface.js";
import { paintTactile, renderTabs, esc } from "/common/skins.js";

initChrome();
const $ = id => document.getElementById(id);
let mod = 0, cell = 0, state = null;

// Must match server/stage.py's HOLD_DURATIONS_S - the server's ring is the
// authoritative timing; these only decide when this client sends the act.
// Every 1-second hold reuses the "cut" charge kind, so the ring's timing is
// right for all of them.
const HOLD_MS = { cut: 1000, discharge: 2000 };
const ACTIONS = {
  wires: [{ key: "c", action: "cut", chargeKind: "cut", label: "HOLD TO CUT" },
          { key: "d", action: "discharge", chargeKind: "discharge", label: "HOLD TO DISCHARGE" }],
  ledger: [{ key: "p", action: "press", chargeKind: "cut", label: "HOLD TO PRESS" },
           { key: "k", action: "skip", chargeKind: "cut", label: "HOLD TO SKIP" }],
  vent: [{ key: "v", action: "purge", chargeKind: "cut", label: "HOLD TO PURGE" }],
  gauge: [{ key: "l", action: "lock", chargeKind: "cut", label: "HOLD TO LOCK IN" }],
  manifest: [{ key: "p", action: "press", chargeKind: "cut", label: "HOLD TO STAMP" }],
  static: [{ key: "p", action: "press", chargeKind: "cut", label: "HOLD TO PRESS" }],
  handshake: [{ key: "h", action: "confirm", chargeKind: "cut", label: "HOLD TO CONFIRM" }],
};
for (const list of Object.values(ACTIONS)) for (const cfg of list) cfg.ms = HOLD_MS[cfg.chargeKind];

const currentKind = () => (state && state.modules[mod] && state.modules[mod].kind) || "wires";
// The shared layout is the one count every module has - views().blind has
// no "count" for Handshake/Gauge, which used to turn arrows into cell=NaN.
const slotCount = () => { const l = state && state.layouts && state.layouts[mod]; return l ? l.slots.length : 0; };
const probe = () => send({ type: "probe", module: mod, cell });

on("state", m => {
  state = m.payload;
  // A REARM can bring a bomb with fewer modules or slots than the last one.
  if (mod >= state.modules.length) { mod = 0; cell = 0; }
  if (cell >= slotCount()) cell = 0;
  if (state.phase !== "running" || state.paused) hold.cancel();
  draw();
});
on("probe_result", m => {
  if (m.module !== mod) return;   // a late answer for a module we've left
  const kind = currentKind(), el = $("readout");
  const noun = kind === "gauge" ? "the knob" : kind === "handshake" ? "the port" : "cell " + (m.data.cell + 1);
  el.textContent = m.data.text ? noun + ": " + m.data.text : "nothing here";
  el.classList.toggle("idle", !m.data.text);
});

// Every way of moving the probe goes through here, so an in-progress hold
// is always cancelled before its target changes.
function moveTo(newMod, newCell) {
  hold.cancel();
  mod = newMod;
  cell = Math.max(0, Math.min(slotCount() - 1, newCell));
  draw();
  probe();
}

function draw() {
  const s = state; if (!s) return;
  const f = s.flags || {};
  $("flags").innerHTML = '<span class="chip"><b>' + esc(f.casing) + '</b> casing</span>' +
    '<span class="chip">corner screw <b>' + esc(f.corner_screw) + '</b></span>' +
    '<span class="chip"><b>' + esc(f.temperature) + '</b> to the touch</span>';
  renderTabs($("tabs"), s.modules, mod, { onPick: i => moveTo(i, 0) });
  const v = s.modules[mod] || {};
  const grid = $("grid");
  grid.dataset.kind = v.kind || "";
  grid.classList.toggle("solved", !!v.solved);
  renderBombFace(grid, (s.layouts && s.layouts[mod]) || { slots: [] }, (el, slot, i) => {
    paintTactile(el, v, i);
    el.classList.toggle("sel", i === cell);
    el.onclick = () => moveTo(mod, i);
  });
  showActions(ACTIONS[currentKind()] || ACTIONS.wires);
}

// T16: on a Gauge the arrows are a real server action (turning the knob),
// not a local cursor move - the knob is the module's only slot.
addEventListener("keydown", e => {
  if (!state || !state.modules.length) return;
  if (e.key === "Tab") { e.preventDefault(); moveTo((mod + 1) % state.modules.length, 0); return; }
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  e.preventDefault();
  if (currentKind() === "gauge") {
    hold.cancel();
    send({ type: "act", module: mod, action: { turn: e.key === "ArrowRight" ? "cw" : "ccw" } });
    probe();
    return;
  }
  moveTo(mod, cell + (e.key === "ArrowRight" ? 1 : -1));
});

const hold = makeHold({
  onStart: h => send({ type: "charge", action: "start", kind: h.cfg.chargeKind, module: h.target.module, cell: h.target.cell }),
  onCancel: () => send({ type: "charge", action: "stop" }),
  onCommit: h => {
    send({ type: "charge", action: "stop" });
    send({ type: "act", module: h.target.module, action: { [h.cfg.action]: h.target.cell } });
  },
});
function startHold(cfg) {
  if (state && state.phase === "running" && !state.paused) hold.start(cfg, { module: mod, cell });
}
// e.repeat is ignored so a key still held after its commit can't silently
// arm and fire again - committing twice takes two presses.
addEventListener("keydown", e => {
  if (e.repeat) return;
  const cfg = (ACTIONS[currentKind()] || []).find(c => c.key === e.key.toLowerCase());
  if (cfg) startHold(cfg);
});
addEventListener("keyup", e => { if (hold.active && hold.active.cfg.key === e.key.toLowerCase()) hold.cancel(); });
// A keyup in another window never arrives here, so leaving mid-hold cancels.
addEventListener("blur", () => hold.cancel());

const showActions = holdButtons($("actionbtns"), hold, startHold);
// The slot under the fingertip fills too, however the hold was started.
(function animateSlot() {
  const a = hold.active;
  [...$("grid").children].forEach((el, i) => {
    const mine = !!a && a.target.module === mod && a.target.cell === i;
    el.classList.toggle("charging", mine);
    paintCharge(el, mine ? hold.progress() : null);
  });
  requestAnimationFrame(animateSlot);
})();

connect();
</script>
