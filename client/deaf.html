<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEAF &middot; BLACKBOX</title>
<link rel="icon" href="/common/icon.svg">
<link rel="stylesheet" href="/common/ui.css">
<body data-role="deaf">
<header class="topbar" id="topbar"></header>
<div id="flash"></div>
<main class="game">
  <section class="room-col">
    <div class="hud" id="hud"></div>
    <div class="stage-frame"><canvas id="stage"></canvas></div>
    <div class="brief" id="brief"></div>
    <div class="log" id="log"></div>
  </section>
  <section class="console">
    <div class="panel">
      <div class="panel-title">THE EXTERIOR <small>only you can see this</small></div>
      <div class="exterior" id="flags"><span class="chip muted">The bomb isn't armed yet.</span></div>
    </div>
    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="pointer-hint" id="pointerhint"></div>
      <div class="bombface" id="grid"></div>
      <div class="keys"><span><kbd>TAB</kbd> next module</span><span>blue dot = BLIND's fingertip</span><span>red fill = BLIND is committing</span></div>
    </div>
  </section>
</main>
<script type="module">
import { connect, on } from "/common/net.js";
import { initChrome, getPresence } from "/common/chrome.js";
import { findPlayer } from "/common/stage.js";
import { renderBombFace } from "/common/bombface.js";
import { paintDeaf, markPresence, renderTabs, swatch, esc } from "/common/skins.js";
import { DISPLAY_NAME } from "/common/roster.js";

initChrome();
const $ = id => document.getElementById(id);
let mod = 0, state = null, flashTimer = null;

on("presence", () => draw());
on("state", m => {
  state = m.payload;
  if (mod >= state.modules.length) mod = 0;
  draw();
});
// MUTE's flashcards reach DEAF only (server-side unicast) - full screen,
// because DEAF can't hear and must not miss one.
on("flash", m => {
  const f = $("flash");
  f.innerHTML = '<div class="card"></div><div class="from">FROM ' + DISPLAY_NAME.mute + "</div>";
  f.querySelector(".card").textContent = m.card;
  f.style.display = "flex";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.style.display = "none"; }, 1200);
});
addEventListener("keydown", e => {
  if (e.key === "Tab" && state && state.modules.length) { e.preventDefault(); mod = (mod + 1) % state.modules.length; draw(); }
});

let flagsKey = null;
function drawFlags(f) {
  const key = JSON.stringify(f);
  if (key === flagsKey) return;
  flagsKey = key;
  const lamps = [0, 1, 2].map(i => '<span class="led' + (i < f.leds ? " on" : "") + '"></span>').join("");
  $("flags").innerHTML =
    '<div class="ext"><span>SERIAL</span><b class="serial">' + esc(f.serial) + "</b></div>" +
    '<div class="ext"><span>BADGE</span><b class="badge"><i style="--swatch:' + swatch(f.badge) + '"></i>' + esc(f.badge) + "</b></div>" +
    '<div class="ext"><span>LEDS LIT \u00b7 ' + esc(f.leds) + '</span><b class="lamps">' + lamps + "</b></div>" +
    '<div class="ext"><span>STICKER</span><b class="sticker">' + esc(f.sticker) + "</b></div>";
}

function draw() {
  const s = state; if (!s) return;
  drawFlags(s.flags || {});
  const presence = getPresence();
  const blind = findPlayer(presence, "blind"), mute = findPlayer(presence, "mute");
  const probe = blind && blind.probe, charge = blind && blind.charge;
  // T12: MUTE's pointer is module-level only - it lights up that module's
  // tab and, once you've tabbed to it, the whole face.
  const pointed = mute && mute.pointer ? mute.pointer.module : null;
  renderTabs($("tabs"), s.modules, mod, { pointed, onPick: i => { mod = i; draw(); } });
  const hint = $("pointerhint");
  hint.textContent = pointed == null ? "" : DISPLAY_NAME.mute + " is pointing at module " + (pointed + 1) +
    (pointed === mod ? "" : " \u2014 press TAB");
  hint.className = "pointer-hint" + (pointed != null ? " active" : "");
  const v = s.modules[mod] || {};
  const grid = $("grid");
  grid.dataset.kind = v.kind || "";
  grid.classList.toggle("pointed", pointed === mod);
  grid.classList.toggle("solved", !!v.solved);
  renderBombFace(grid, (s.layouts && s.layouts[mod]) || { slots: [] }, (el, slot, i) => {
    paintDeaf(el, v, i);
    const here = ref => ref && ref.module === mod && ref.cell === i;
    markPresence(el, here(probe), here(charge) ? charge.progress : null);
  });
}

connect();
</script>
