<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUTE &middot; BLACKBOX</title>
<link rel="icon" href="/common/icon.svg">
<link rel="stylesheet" href="/common/ui.css">
<body data-role="mute">
<header class="topbar" id="topbar"></header>
<main class="game">
  <section class="room-col">
    <div class="hud" id="hud"></div>
    <div class="stage-frame"><canvas id="stage"></canvas></div>
    <div class="panel">
      <div class="panel-title">FLASHCARDS <small>shown full-screen to DEAF only &middot; one every 2 seconds</small></div>
      <div class="cards" id="cards"></div>
      <div class="cooldown" id="cooldown"><i></i></div>
      <div class="sent-line" id="sentline"></div>
    </div>
    <div class="panel">
      <div class="panel-title">THE BOMB <small>click a module to point at it for everyone</small></div>
      <div class="shells" id="bombfaces"><span class="chip muted">Arm the bomb to see its modules.</span></div>
    </div>
    <div class="brief" id="brief"></div>
    <div class="log" id="log"></div>
  </section>
  <section class="console sticky">
    <div class="panel armbar">
      <button class="btn-primary" id="start" disabled>ARM THE BOMB</button>
      <span class="seg" id="count" title="Modules on the bomb - more is harder"></span>
      <a class="btn btn-quiet" id="manual" target="_blank" rel="noopener">PRINT MANUAL &#8599;</a>
    </div>
    <iframe class="manual-frame" id="frame" title="Defusal manual" hidden></iframe>
    <div class="manual-empty" id="nomanual">The manual is generated when the bomb is armed.<br>Only you can see it - read it, then signal.</div>
  </section>
</main>
<script type="module">
import { connect, on, send, ROOM } from "/common/net.js";
import { initChrome, getPresence } from "/common/chrome.js";
import { findPlayer } from "/common/stage.js";
import { renderShells } from "/common/skins.js";
import { coreConnected, DISPLAY_NAME } from "/common/roster.js";

const $ = id => document.getElementById(id);
let state = null, lobbyRoster = null;
let modules = Number(localStorage.getItem("blackbox.modules")) || 2;

// Shared by ARM and the overlay's REARM - the server always builds a fresh
// Bomb here and ignores this while a round is still running.
const arm = () => send({ type: "start", modules, seconds: 300 });
initChrome({ onRearm: arm });

// Card, key, key label. SPACE is STOP: the one card that has to land inside
// BLIND's one-second hold.
const CARDS = [["STOP", " ", "SPACE"], ["GO", "g"], ["YES", "y"], ["NO", "n"], ["WAIT", "w"], ["AGAIN", "a"],
  ["1", "1"], ["2", "2"], ["3", "3"], ["4", "4"], ["LEFT", "ArrowLeft", "\u2190"], ["RIGHT", "ArrowRight", "\u2192"]];
let cooling = false;
const flash = card => { if (!cooling) send({ type: "flash", card }); };
for (const [card, key, label] of CARDS) {
  const b = document.createElement("button");
  b.className = "card-btn" + (card === "STOP" ? " stop" : "");
  b.dataset.card = card;
  b.innerHTML = "<kbd>" + (label || key.toUpperCase()) + "</kbd>" + card;
  b.addEventListener("mousedown", e => e.preventDefault());   // keep focus off, so SPACE stays STOP
  b.onclick = () => flash(card);
  $("cards").appendChild(b);
}
addEventListener("keydown", e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey || e.target.closest("input, select, textarea, button, a")) return;
  const hit = CARDS.find(([, key]) => key === e.key || key === e.key.toLowerCase());
  if (hit) { e.preventDefault(); flash(hit[0]); }
});
// A mouse-clicked button keeps focus and would swallow SPACE; hand focus
// back to the page so SPACE always means STOP. (detail is 0 for keyboard
// activation, which keeps its focus.)
addEventListener("click", e => { const b = e.target.closest("button"); if (b && e.detail > 0) b.blur(); });
// The server owns the cooldown and silently drops an early flash, so the
// board only cools down once a flash is confirmed sent.
on("flash_ok", m => {
  cooling = true;
  $("cards").classList.add("cooling");
  const bar = $("cooldown");
  bar.classList.remove("run"); void bar.offsetWidth; bar.classList.add("run");
  const btn = $("cards").querySelector('[data-card="' + m.card + '"]');
  if (btn) { btn.classList.remove("sent"); void btn.offsetWidth; btn.classList.add("sent"); }
  $("sentline").innerHTML = "You flashed <b></b> to " + DISPLAY_NAME.deaf + ".";
  $("sentline").querySelector("b").textContent = m.card;
  setTimeout(() => { cooling = false; $("cards").classList.remove("cooling"); }, 2000);
});

// Difficulty is module count (AGENTS.md), never a shorter timer.
$("count").innerHTML = '<span class="seg-label">MODULES</span>';
for (const n of [1, 2, 3, 4]) {
  const b = document.createElement("button");
  b.textContent = n;
  b.onclick = () => { modules = n; localStorage.setItem("blackbox.modules", n); paintCount(); };
  $("count").appendChild(b);
}
const paintCount = () => [...$("count").querySelectorAll("button")].forEach((b, i) => b.classList.toggle("on", i + 1 === modules));
paintCount();
$("start").onclick = arm;
$("manual").href = "/manual/" + ROOM;

// ARM needs the three core seats (a UI convenience - the server is the
// authority) and no round in progress.
function paintArm() {
  const running = state && state.phase === "running";
  const ready = state ? !running : coreConnected(lobbyRoster);
  $("start").disabled = !ready;
  $("start").textContent = running ? "ROUND IN PROGRESS" : state ? "REARM" : "ARM THE BOMB";
  $("start").title = ready ? "" : running ? "" : "Waiting for BLIND, DEAF and MUTE to connect";
}
on("lobby", m => { lobbyRoster = m.roster; paintArm(); });

let manualFor = null;
function loadManual(force) {
  if (!force && manualFor === ROOM) return;
  manualFor = ROOM;
  $("frame").src = "/manual/" + ROOM + "?t=" + Date.now();
  $("frame").hidden = false;
  $("nomanual").hidden = true;
}
on("log", m => { if (/^Bomb armed/.test(m.text)) loadManual(true); });

// MUTE's own views() carry no per-slot data, so the shells are indices only.
const drawShells = () => { if (state) renderShells($("bombfaces"), state, getPresence(), { onPoint: sendPoint }); };
on("state", m => { state = m.payload; paintArm(); loadManual(false); drawShells(); });
on("presence", drawShells);

// T12: pointing is module-level only (the server drops any cell unless
// precise_pointing is on); clicking the pointed module again clears it.
function sendPoint(i) {
  const me = findPlayer(getPresence(), "mute");
  send({ type: "point", target: me && me.pointer && me.pointer.module === i ? {} : { module: i } });
}

connect();
</script>
