<!doctype html>
<meta charset="utf-8"><title>HANDS</title>
<link rel="stylesheet" href="/common/ui.css">
<h1>H A N D S</h1><p id="status"></p>
<p class="comms-card" id="comms"></p>
<div class="roster" id="roster"></div>
<button class="readybtn" id="ready">I'M READY</button>
<div class="stagewrap"><canvas id="stage" width="900" height="320"></canvas></div>
<div class="flags" id="flags"></div>
<div class="hud"><div id="time">--:--</div><div class="strikes" id="strikes"></div><div id="phase"></div></div>
<p style="color:#6b6b6b;font-size:13px">ARROWS move the probe &middot; hold <b>C</b> 1s to cut &middot; hold <b>D</b> 2s to discharge &middot; TAB switches module</p>
<div class="bombface" id="grid"></div>
<div class="readout" id="readout">probe idle</div>
<div style="margin-top:12px">
  <button class="holdbtn" id="cut">HOLD TO CUT<span class="fill"></span></button>
  <button class="holdbtn" id="dis">HOLD TO DISCHARGE<span class="fill"></span></button>
</div>
<div id="log"></div>
<script type="module">
import { connect, on, send, logLine, fmtTime, holdButton, ROLE } from "/common/net.js";
import { updateOverlay } from "/common/overlay.js";
import { updateTimerAudio } from "/common/timer-audio.js";
import { init as initStage, setPresence, setBomb } from "/common/stage.js";
import { renderBombFace } from "/common/bombface.js";
import { COMMS, renderRoster, pauseText } from "/common/roster.js";
document.getElementById("comms").textContent = COMMS[ROLE];
let mod = 0, cell = 0, state = null, presence = null;

on("lobby", m => renderRoster(document.getElementById("roster"), m.roster));
let isReady = false;
const readyBtn = document.getElementById("ready");
readyBtn.onclick = () => {
  isReady = !isReady;
  send({ type: "ready", value: isReady });
  readyBtn.classList.toggle("is-ready", isReady);
  readyBtn.textContent = isReady ? "\u2713 READY" : "I'M READY";
};

initStage(document.getElementById("stage"), ROLE, send);
on("presence", m => { presence = m.payload; setPresence(m.payload); });
on("state", m => { state = m.payload; draw(); updateOverlay(state.phase); updateTimerAudio(state.time_left, state.phase); setBomb(state); });
on("log", m => logLine(m.text));
on("error", m => logLine("ERROR " + m.text));
on("probe_result", m => {
  document.getElementById("readout").textContent =
    m.data.text ? ("cell " + (m.data.cell + 1) + ": " + m.data.text) : "nothing here";
});

function probe() { send({ type: "probe", module: mod, cell: cell }); }

function draw() {
  const s = state; if (!s) return;
  document.getElementById("time").textContent = fmtTime(s.time_left);
  document.getElementById("strikes").textContent = "X".repeat(s.strikes);
  const ph = document.getElementById("phase");
  if (s.paused) { ph.textContent = pauseText(presence); ph.className = "paused"; }
  else { ph.textContent = s.phase === "running" ? "" : s.phase.toUpperCase(); ph.className = s.phase; }
  document.getElementById("flags").textContent =
    "casing " + s.flags.casing + " / corner screw " + s.flags.corner_screw + " / " + s.flags.temperature + " to the touch";
  const v = s.modules[mod] || { count: 0, cut: [] };
  const layout = (s.layouts && s.layouts[mod]) || { slots: [] };
  renderBombFace(document.getElementById("grid"), layout, (el, slot, i) => {
    el.className = "slot" + (i === cell ? " sel" : "") + (v.cut[i] ? " cut" : "");
    el.textContent = "[" + (i + 1) + "]";
    el.onclick = () => { cell = i; draw(); probe(); };
  });
}

addEventListener("keydown", e => {
  const v = state && state.modules[mod];
  if (!v) return;
  if (e.key === "ArrowRight") { cell = Math.min(v.count - 1, cell + 1); draw(); probe(); }
  if (e.key === "ArrowLeft") { cell = Math.max(0, cell - 1); draw(); probe(); }
  if (e.key === "Tab") { e.preventDefault(); mod = (mod + 1) % state.modules.length; cell = 0; draw(); probe(); }
});

const holds = {};
// Hold durations. Must match server/stage.py's HOLD_DURATIONS_S - that copy
// is what the broadcast ring's fill rate uses; this copy is what decides
// when THIS client actually fires the real cut/discharge action. Keep them
// in sync if either ever changes.
const HOLD_MS = { cut: 1000, discharge: 2000 };

function beginCharge(kind) { send({ type: "charge", action: "start", kind, module: mod, cell }); }
function endCharge() { send({ type: "charge", action: "stop" }); }

function keyHold(key, kind, fireAction) {
  addEventListener("keydown", e => {
    if (e.key.toLowerCase() !== key || holds[key]) return;
    beginCharge(kind);
    holds[key] = setTimeout(() => { endCharge(); fireAction(); holds[key] = null; }, HOLD_MS[kind]);
  });
  addEventListener("keyup", e => {
    if (e.key.toLowerCase() === key && holds[key]) { clearTimeout(holds[key]); holds[key] = null; endCharge(); }
  });
}
keyHold("c", "cut", () => send({ type: "act", module: mod, action: { cut: cell } }));
keyHold("d", "discharge", () => send({ type: "act", module: mod, action: { discharge: cell } }));
holdButton(document.getElementById("cut"), HOLD_MS.cut,
  () => send({ type: "act", module: mod, action: { cut: cell } }),
  () => beginCharge("cut"), endCharge);
holdButton(document.getElementById("dis"), HOLD_MS.discharge,
  () => send({ type: "act", module: mod, action: { discharge: cell } }),
  () => beginCharge("discharge"), endCharge);

connect();
</script>
